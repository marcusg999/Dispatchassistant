name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, unit tests, audit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Build (with placeholder env) + dist secret scan
        run: npm run build
        env:
          PORTAL_KEY: ci-placeholder-portal-key-0000
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  database:
    name: RLS, functions and E2E (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,mailpit,supavisor
      - name: Write local .env
        run: |
          npx supabase status -o env > sb.env
          . ./sb.env
          {
            echo "PORTAL_KEY=local-dev-portal-key-1234"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET"
          } > .env
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
