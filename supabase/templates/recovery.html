<h2>Reset your admin password</h2>
<p>We received a request to reset the password for this admin account.</p>
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery">Choose a new password</a></p>
<p>The link works once and expires in an hour. If you didn't ask for this, ignore this email: your password stays the same.</p>
